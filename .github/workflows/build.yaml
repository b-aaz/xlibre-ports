on:
  push:
    branches:
      - master
      - beta
      - dev
      - ci-dev

name: CI on ${{ github.ref_name }}

permissions:
  contents: write

env:
  CI_RUN_DIR: "/opt/run/"
  CI_ART_DIR: "/opt/artifacts/"


jobs:
  build_fbsd:
    name: FreeBSD build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: FreeBSD build.
    - run: >
        echo '::group::CLONE'
        && sudo mkdir -p "${CI_RUN_DIR}" &&
        curl -L "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_REF"
        | sudo tar -xvz --strip-components=1 -C "${CI_RUN_DIR}"
        && echo '::endgroup::'
        && sudo -H -E "${CI_RUN_DIR}".ci/ci.sh fbsd
    - name: Release (If required).
      env:
        RUN_TOKEN: ghp_1234123412341234123412341234123412341234
    - run: >
        echo '::group::RELEASE'
        && awk 'BEGIN{print ENVIRON["RUN_TOKEN"]}'|gh auth login --with-token||true
        && unset -v RUN_TOKEN
        && sh "${CI_RUN_DIR}".ci/release.sh
        && echo '::endgroup::'
  build_fbsd_legacy:
    name: FreeBSD Legacy build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
