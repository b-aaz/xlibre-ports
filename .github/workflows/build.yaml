on:
  push:
    branches:
      - master
      - beta
      - dev
      - ci-dev

name: CI package builder.

permissions:
  contents: write

env:
  CI_RUN_DIR: "/opt/run/"
  CI_ART_DIR: "/opt/artifacts/"


jobs:
  build_fbsd:
    name: FreeBSD build.
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
    - name: FreeBSD build.
      run: |
        set -e;
        echo '::group::CLONE';
        sudo mkdir -p "${CI_RUN_DIR}";
        curl -fsSL --retry 4 --retry-delay 60 \
          "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_REF" |
          sudo tar -xvz --strip-components=1 -C "${CI_RUN_DIR}";
        echo '::endgroup::';
        sudo -H -E "${CI_RUN_DIR}".ci/ci.sh fbsd;
    - name: Upload release files (If required).
      env:
        RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e;
        echo '::group::RELEASE';
        awk 'BEGIN{print ENVIRON["RUN_TOKEN"]}' | gh auth login --with-token;
        unset -v RUN_TOKEN;
        sh "${CI_RUN_DIR}".ci/release.sh;
        echo '::endgroup::';
  build_fbsd_legacy:
    name: FreeBSD Legacy build.
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
    - name: FreeBSD Legacy build.
      run: |
        set -e;
        echo '::group::CLONE';
        sudo mkdir -p "${CI_RUN_DIR}";
        curl -fsSL --retry 4 --retry-delay 60 \
          "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_REF" |
          sudo tar -xvz --strip-components=1 -C "${CI_RUN_DIR}";
        echo '::endgroup::';
        sudo -H -E "${CI_RUN_DIR}".ci/ci.sh fbsd-legacy;
    - name: Upload release files (If required).
      env:
        RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e;
        echo '::group::RELEASE';
        awk 'BEGIN{print ENVIRON["RUN_TOKEN"]}' | gh auth login --with-token;
        unset -v RUN_TOKEN;
        sh "${CI_RUN_DIR}".ci/release.sh;
        echo '::endgroup::';
  build_dfbsd:
    name: DragonflyBSD build.
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
    - name: DragonflyBSD build.
      run: |
        set -e;
        echo '::group::CLONE';
        sudo mkdir -p "${CI_RUN_DIR}";
        curl -fsSL --retry 4 --retry-delay 60 \
          "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_REF" |
          sudo tar -xvz --strip-components=1 -C "${CI_RUN_DIR}";
        echo '::endgroup::';
        sudo -H -E "${CI_RUN_DIR}".ci/ci.sh dfbsd;
    - name: Upload release files (If required).
      env:
        RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e;
        echo '::group::RELEASE';
        awk 'BEGIN{print ENVIRON["RUN_TOKEN"]}' | gh auth login --with-token;
        unset -v RUN_TOKEN;
        sh "${CI_RUN_DIR}".ci/release.sh;
        echo '::endgroup::';
  build_release:
    if: ${{ always() }}
    needs: [build_fbsd,build_fbsd_legacy,build_dfbsd]
    name: Final concatenated release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Did anything fail?
      if: |
        always() &&
        needs.build_fbsd.result == 'success' &&
        needs.build_fbsd_legacy.result == 'success' &&
        needs.build_dfbsd.result == 'success'
      run: echo "ALL_DONE=true" | tee /dev/stderr >> "$GITHUB_ENV"
    - name: Release/cleanup step.
      env:
        RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e;
        echo '::group::CLONE';
        sudo mkdir -p "${CI_RUN_DIR}";
        curl -fsSL --retry 4 --retry-delay 60 \
          "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_REF" |
          sudo tar -xvz --strip-components=1 -C "${CI_RUN_DIR}";
        echo '::endgroup::';
        echo '::group::RELEASE';
        awk 'BEGIN{print ENVIRON["RUN_TOKEN"]}' | gh auth login --with-token;
        unset -v RUN_TOKEN;
        [ "${ALL_DONE}" != "true" ] && arg="cleanup" || arg="final";
        sh "${CI_RUN_DIR}".ci/release.sh "${arg}";
        echo '::endgroup::';

